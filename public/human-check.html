<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'">
  <title>防刷验证测试</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20251c;background:#f6f7f1}*{box-sizing:border-box}body{margin:0;padding:28px 16px}main{max-width:520px;margin:auto;background:#fff;border:1px solid #dde1d5;border-radius:14px;padding:25px}h1{font-size:24px;margin:0 0 12px}p{font-size:14px;line-height:1.8;margin:12px 0}.notice{background:#fff7db;border-radius:8px;padding:11px 13px}.status{color:#536047;overflow-wrap:anywhere}#widget{display:flex;justify-content:center;min-height:140px;margin:18px 0}button{font:inherit;border:1px solid #c7ad4b;border-radius:8px;background:#f3cb49;color:#2b281b;min-height:46px;padding:11px 15px;width:100%;cursor:pointer}button:disabled{background:#f0f2e9;border-color:#dce1d1;color:#7e8772;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #94731a;outline-offset:3px}#retry{margin-top:10px;background:white;border-color:#cbd2bf}#result{padding:12px 14px;border:1px solid #d2dfc0;border-radius:8px;background:#f1f7e8;overflow-wrap:anywhere;white-space:pre-line}#result.error{background:#fff4ef;border-color:#e8d0c2}a{color:#70580e;text-underline-offset:3px}[hidden]{display:none!important}.footnote{color:#6e7761;font-size:12px}
  </style>
</head>
<body>
  <main>
    <h1>防刷验证测试</h1>
    <p class="notice">仅供运营者检查人机验证连接。不会创建订单、生成照片或请求付款，也不会消耗生图名额。</p>
    <p id="status" class="status" role="status" aria-live="polite">正在加载正式人机验证…</p>
    <div id="widget" aria-label="人机验证"></div>
    <button id="verify" disabled>验证并检查重复提交</button>
    <button id="retry" disabled>重新人机验证</button>
    <p id="result" role="status" aria-live="polite" hidden></p>
    <p id="hostNotice" class="status" hidden>请在正式服务地址打开此测试页：<a href="https://xhuozhong.com/human-check.html">前往 xhuozhong.com</a>。</p>
    <p class="footnote">验证码仅暂存于本页内存，刷新后失效。测试只发送一次验证和一次重复提交，不使用钱包。</p>
  </main>
  <script type="module" src="human-check.js?ver=trial-privacy-20261005.1"></script>
</body>
</html>
